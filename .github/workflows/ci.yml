name: Check and private release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main commit to deploy privately
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAIL_PACKAGES_READ_TOKEN }}
      - run: bun run check
      - run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bibliography-worker"
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: bibliography-production-release
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject stale or unchecked release
        run: |
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAIL_PACKAGES_READ_TOKEN }}
      - run: bun run build
      - name: Deploy checked current main privately and read back configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAIL_IDENTITY_JWKS: ${{ secrets.CAIL_IDENTITY_JWKS }}
        run: |
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export RELEASE_SECRETS_FILE="$RUNNER_TEMP/bibliography-secrets.json"
          trap 'rm -f "$RELEASE_SECRETS_FILE"' EXIT
          bun -e 'import {writeFileSync} from "node:fs"; import {loadIdentityVerifierConfig,CAIL_CANONICAL_ISSUER} from "@cuny-ai-lab/cail-identity"; const jwks=process.env.CAIL_IDENTITY_JWKS; for(const expectedAudience of ["cail:bibliography","cail:gateway"]){const result=await loadIdentityVerifierConfig({jwks,issuer:CAIL_CANONICAL_ISSUER,expectedAudience,supportedIssuers:[CAIL_CANONICAL_ISSUER]}); if(!result.ok) throw new Error("Invalid release identity configuration");} writeFileSync(process.env.RELEASE_SECRETS_FILE,JSON.stringify({CAIL_IDENTITY_JWKS:jwks}),{mode:0o600});'
          bunx wrangler deploy --strict --tag "$RELEASE_SHA" --message "commit $RELEASE_SHA" --secrets-file "$RELEASE_SECRETS_FILE"
          bun scripts/verify-release.mjs
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
